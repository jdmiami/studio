<!doctype html><html><head><meta charset=utf-8><style>html,body{margin:0;background:#f6efe4}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const W = 512, H = 640;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); r.setPixelRatio(1); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#f6efe4');
const pmrem = new THREE.PMREMGenerator(r); scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const key = new THREE.DirectionalLight('#fff4e0', 2.2); key.position.set(2, 4, 3); scene.add(key); scene.add(new THREE.AmbientLight('#ffffff', 0.5));
const cam = new THREE.PerspectiveCamera(30, W / H, 0.01, 100);
const g = await new GLTFLoader().loadAsync('/model.glb');
const root = g.scene; scene.add(root);
const box = new THREE.Box3().setFromObject(root); const size = box.getSize(new THREE.Vector3()); const c = box.getCenter(new THREE.Vector3()); root.position.sub(c);
const R = Math.max(size.x, size.y, size.z); const dist = R * 2.1;
let tris = 0; root.traverse(o => { if (o.isMesh) tris += o.geometry.index ? o.geometry.index.count / 3 : o.geometry.attributes.position.count / 3; });
window.info = { size: size.toArray(), tris };
window.shot = (deg) => { const a = deg * Math.PI / 180; cam.position.set(Math.sin(a) * dist, R * 0.25, Math.cos(a) * dist); cam.lookAt(0, 0, 0); r.render(scene, cam); return r.domElement.toDataURL('image/png'); };
window.ready = true;
</script></body></html>
