<!doctype html><html><head><meta charset=utf-8><style>html,body{margin:0;background:#f6efe4}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body>
<script type="module">
// Plays the glTF animations of anim.glb (served beside this page) for animcheck.py: window.play(clip, t), window.shot(deg).
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const W = 512, H = 640;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#f6efe4');
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
const key = new THREE.DirectionalLight('#fff4e0', 2.2); key.position.set(2, 4, 3); scene.add(key); scene.add(new THREE.AmbientLight('#ffffff', 0.5));
const cam = new THREE.PerspectiveCamera(30, W / H, 0.01, 100);
const g = await new GLTFLoader().loadAsync('/anim.glb'); const root = g.scene; scene.add(root); root.updateMatrixWorld(true);
const box = new THREE.Box3().setFromObject(root); const size = box.getSize(new THREE.Vector3()); const c = box.getCenter(new THREE.Vector3()); const R = Math.max(size.x, size.y, size.z); const dist = R * 2.1;
const mixer = new THREE.AnimationMixer(root); const clips = {}; for (const cl of g.animations) clips[cl.name] = cl;
window.info = { clips: g.animations.map(a => [a.name, +a.duration.toFixed(2), a.tracks.length]) };
window.play = (name, t) => { mixer.stopAllAction(); const a = mixer.clipAction(clips[name]); a.play(); mixer.setTime(t); root.updateMatrixWorld(true); };
window.shot = (deg, el = 0.1) => { const a = deg * Math.PI / 180; cam.position.set(c.x + Math.sin(a) * dist, c.y + R * el, c.z + Math.cos(a) * dist); cam.lookAt(c); r.render(scene, cam); return r.domElement.toDataURL('image/png'); };
window.ready = true;
</script></body></html>
